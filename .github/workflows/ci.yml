name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # On main, once every check below passed, the image is built from the
      # editor packages built here and pushed to GitHub's container registry
      # as ghcr.io/<owner>/lukis-frontend.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend

      # The editor is built from our Excalidraw fork at the commit the
      # tarballs were last built from (scripts/build-excalidraw.sh records it).
      - name: Read the Excalidraw commit
        id: excalidraw
        run: echo "ref=$(cat frontend/.excalidraw-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: isma27k/lukis-editor
          ref: ${{ steps.excalidraw.outputs.ref }}
          path: excalidraw

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g yarn@1.22.22

      - name: Build the editor and install dependencies
        working-directory: frontend
        run: npm run excalidraw:build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: npx prettier --check "**/*.{ts,tsx}"
      # Before typecheck, which reads the route types the build generates.
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Image names must be lowercase; the owner (Isma27K) isn't.
      - name: Image name
        if: env.PUBLISH == 'true'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lukis-frontend" >> "$GITHUB_OUTPUT"
      - if: env.PUBLISH == 'true'
        uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # "latest", plus "sha-<short commit>" to pin or roll back to.
      - if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha
      # A path context, so the build sees vendor/ and public/fonts, which are
      # gitignored but were built above. (Without one it builds from git.)
      - if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

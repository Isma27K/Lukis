# Leaves the bundled object storage out, for S3-compatible storage you
# already have (AWS S3, Cloudflare R2, MinIO, another RustFS…). Turn it on
# with this in .env, and set S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY and
# S3_SECRET_KEY there too:
#   COMPOSE_FILE=compose.yaml:docker/compose.own-storage.yaml
# Combine with the MongoDB one by listing both, separated by colons.
services:
  storage:
    # Only started when asked for by name, so it never is.
    profiles: [own-storage]

# Lukis: the whole app in one stack.
#
#   docker compose up -d
#
# Then open http://localhost:3000. Nothing needs configuring to try it on
# your own computer. To put it on a server, copy .env.example to .env and set
# PUBLIC_URL; docs/self-hosting.md is the full guide.
name: lukis

services:
  # The web app. It passes /api (including the live-collaboration
  # WebSockets) on to the backend, so it's the only service people reach.
  frontend:
    image: ghcr.io/isma27k/lukis-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      # Only this computer by default. Use LUKIS_PORT=3000 to open it to your
      # network, or COMPOSE_PROFILES=caddy for HTTPS on ports 80 and 443.
      - "${LUKIS_PORT:-127.0.0.1:3000}:3000"
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy

  # Accounts, drawings, version history and live collaboration. Reads every
  # setting in .env (email, logins with Google/GitHub/Microsoft, SETUP_CODE…).
  backend:
    image: ghcr.io/isma27k/lukis-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: &backend-env
      FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lukis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lukis-storage-secret}
    # Lets MONGO_URL or S3_ENDPOINT point at this machine itself, as
    # host.docker.internal. Docker Desktop has it built in; Linux doesn't.
    extra_hosts: &host-gateway
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 20s
      start_interval: 2s
      retries: 3
    depends_on: &data-services
      # Not required, so docker/compose.own-*.yaml can leave them out.
      mongo:
        condition: service_healthy
        required: false
      storage:
        condition: service_healthy
        required: false

  # The database. Only reachable from the other services, never published.
  # 7.0 rather than 8.0: MongoDB 8.0 won't start on Linux kernels 6.19 to
  # 7.0.13, and containers run on the host's kernel.
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 5

  # S3-compatible object storage (RustFS) for images, thumbnails, profile
  # pictures and backups. Only reachable from the other services, never
  # published, which is why default keys are acceptable. Set S3_ACCESS_KEY and
  # S3_SECRET_KEY in .env before the first start to choose your own.
  storage:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-lukis}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-lukis-storage-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 5

  # HTTPS with certificates from Let's Encrypt, for a server with a domain.
  # Off unless COMPOSE_PROFILES includes "caddy". It serves PUBLIC_URL
  # (https://draw.example.com, or http://<ip> without a domain), unless
  # CADDY_ADDRESS says otherwise (":80" behind a Cloudflare Tunnel).
  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${CADDY_ADDRESS:-${PUBLIC_URL:-http://localhost}}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # A database backup to object storage every day, keeping BACKUP_KEEP_DAYS
  # days of them. Off unless COMPOSE_PROFILES includes "backup".
  backup:
    profiles: [backup]
    image: ghcr.io/isma27k/lukis-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    command:
      [
        "python", "-m", "scripts.backup", "--log-config", "logging.json",
        "run", "--every-hours", "24",
      ]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    extra_hosts: *host-gateway
    depends_on: *data-services

volumes:
  mongo_data:
  storage_data:
  caddy_data:
  caddy_config:
